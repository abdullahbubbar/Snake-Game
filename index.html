<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Arial', sans-serif;
        }

        .game-container {
            text-align: center;
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
        }

        .score-board {
            display: flex;
            justify-content: space-around;
            margin-bottom: 20px;
            font-size: 18px;
            color: #555;
        }

        .score {
            font-weight: bold;
            color: #667eea;
        }

        #gameCanvas {
            border: 3px solid #333;
            border-radius: 5px;
            background-color: #1a1a1a;
            display: block;
            margin: 0 auto;
        }

        .controls {
            margin-top: 20px;
        }

        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 16px;
            border-radius: 25px;
            cursor: pointer;
            margin: 5px;
            transition: all 0.3s;
        }

        button:hover {
            background: #764ba2;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        button:active {
            transform: translateY(0);
        }

        .game-over {
            color: #e74c3c;
            font-size: 24px;
            font-weight: bold;
            margin-top: 10px;
            display: none;
        }

        .instructions {
            margin-top: 15px;
            color: #666;
            font-size: 14px;
        }

        .arrow-keys {
            display: grid;
            grid-template-columns: repeat(3, 50px);
            gap: 5px;
            justify-content: center;
            margin-top: 15px;
        }

        .key {
            width: 50px;
            height: 50px;
            background: #f0f0f0;
            border: 2px solid #ddd;
            border-radius: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            cursor: pointer;
            user-select: none;
        }

        .key:active {
            background: #ddd;
        }

        .key:nth-child(1) {
            grid-column: 2;
        }

        .key:nth-child(2) {
            grid-column: 1;
            grid-row: 2;
        }

        .key:nth-child(3) {
            grid-column: 2;
            grid-row: 2;
        }

        .key:nth-child(4) {
            grid-column: 3;
            grid-row: 2;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>🐍 Snake Game</h1>
        
        <div class="score-board">
            <div>Score: <span class="score" id="score">0</span></div>
            <div>High Score: <span class="score" id="highScore">0</span></div>
        </div>

        <canvas id="gameCanvas" width="400" height="400"></canvas>

        <div class="game-over" id="gameOver">Game Over! Press Restart</div>

        <div class="controls">
            <button id="startBtn">Start Game</button>
            <button id="restartBtn">Restart</button>
        </div>

        <div class="instructions">
            Use Arrow Keys or buttons below to control the snake
        </div>

        <div class="arrow-keys">
            <div class="key" data-key="up">▲</div>
            <div class="key" data-key="left">◄</div>
            <div class="key" data-key="down">▼</div>
            <div class="key" data-key="right">►</div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');
        const highScoreElement = document.getElementById('highScore');
        const gameOverElement = document.getElementById('gameOver');
        const startBtn = document.getElementById('startBtn');
        const restartBtn = document.getElementById('restartBtn');

        // Game settings
        const gridSize = 20;
        const tileCount = canvas.width / gridSize;

        // Game state
        let snake = [{ x: 10, y: 10 }];
        let food = { x: 15, y: 15 };
        let dx = 0;
        let dy = 0;
        let score = 0;
        let highScore = localStorage.getItem('snakeHighScore') || 0;
        let gameLoop;
        let gameStarted = false;
        let gameIsOver = false;

        highScoreElement.textContent = highScore;

        // Initialize game
        function init() {
            snake = [{ x: 10, y: 10 }];
            dx = 0;
            dy = 0;
            score = 0;
            gameIsOver = false;
            scoreElement.textContent = score;
            gameOverElement.style.display = 'none';
            generateFood();
            drawGame();
        }

        // Generate food at random position
        function generateFood() {
            food = {
                x: Math.floor(Math.random() * tileCount),
                y: Math.floor(Math.random() * tileCount)
            };

            // Make sure food doesn't spawn on snake
            for (let segment of snake) {
                if (segment.x === food.x && segment.y === food.y) {
                    generateFood();
                    return;
                }
            }
        }

        // Draw everything
        function drawGame() {
            // Clear canvas
            ctx.fillStyle = '#1a1a1a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw grid
            ctx.strokeStyle = '#2a2a2a';
            ctx.lineWidth = 1;
            for (let i = 0; i < tileCount; i++) {
                ctx.beginPath();
                ctx.moveTo(i * gridSize, 0);
                ctx.lineTo(i * gridSize, canvas.height);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(0, i * gridSize);
                ctx.lineTo(canvas.width, i * gridSize);
                ctx.stroke();
            }

            // Draw snake
            snake.forEach((segment, index) => {
                if (index === 0) {
                    // Head
                    ctx.fillStyle = '#4CAF50';
                } else {
                    // Body
                    ctx.fillStyle = '#8BC34A';
                }
                ctx.fillRect(
                    segment.x * gridSize + 1,
                    segment.y * gridSize + 1,
                    gridSize - 2,
                    gridSize - 2
                );

                // Add eyes to head
                if (index === 0) {
                    ctx.fillStyle = 'white';
                    const eyeSize = 3;
                    if (dx === 1) { // Right
                        ctx.fillRect(segment.x * gridSize + 12, segment.y * gridSize + 5, eyeSize, eyeSize);
                        ctx.fillRect(segment.x * gridSize + 12, segment.y * gridSize + 12, eyeSize, eyeSize);
                    } else if (dx === -1) { // Left
                        ctx.fillRect(segment.x * gridSize + 5, segment.y * gridSize + 5, eyeSize, eyeSize);
                        ctx.fillRect(segment.x * gridSize + 5, segment.y * gridSize + 12, eyeSize, eyeSize);
                    } else if (dy === 1) { // Down
                        ctx.fillRect(segment.x * gridSize + 5, segment.y * gridSize + 12, eyeSize, eyeSize);
                        ctx.fillRect(segment.x * gridSize + 12, segment.y * gridSize + 12, eyeSize, eyeSize);
                    } else if (dy === -1) { // Up
                        ctx.fillRect(segment.x * gridSize + 5, segment.y * gridSize + 5, eyeSize, eyeSize);
                        ctx.fillRect(segment.x * gridSize + 12, segment.y * gridSize + 5, eyeSize, eyeSize);
                    }
                }
            });

            // Draw food
            ctx.fillStyle = '#FF5722';
            ctx.beginPath();
            ctx.arc(
                food.x * gridSize + gridSize / 2,
                food.y * gridSize + gridSize / 2,
                gridSize / 2 - 2,
                0,
                Math.PI * 2
            );
            ctx.fill();
        }

        // Update game state
        function update() {
            if (gameIsOver) return;

            // Move snake
            const head = { x: snake[0].x + dx, y: snake[0].y + dy };

            // Check wall collision
            if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
                endGame();
                return;
            }

            // Check self collision
            for (let segment of snake) {
                if (segment.x === head.x && segment.y === head.y) {
                    endGame();
                    return;
                }
            }

            snake.unshift(head);

            // Check food collision
            if (head.x === food.x && head.y === food.y) {
                score++;
                scoreElement.textContent = score;
                
                if (score > highScore) {
                    highScore = score;
                    highScoreElement.textContent = highScore;
                    localStorage.setItem('snakeHighScore', highScore);
                }
                
                generateFood();
            } else {
                snake.pop();
            }

            drawGame();
        }

        // End game
        function endGame() {
            gameIsOver = true;
            clearInterval(gameLoop);
            gameStarted = false;
            gameOverElement.style.display = 'block';
        }

        // Start game
        function startGame() {
            if (gameStarted) return;
            
            if (gameIsOver) {
                init();
            }
            
            if (dx === 0 && dy === 0) {
                dx = 1; // Start moving right
            }
            
            gameStarted = true;
            gameLoop = setInterval(update, 100);
        }

        // Restart game
        function restart() {
            clearInterval(gameLoop);
            gameStarted = false;
            init();
        }

        // Keyboard controls
        document.addEventListener('keydown', (e) => {
            const key = e.key;

            if (key === 'ArrowUp' && dy === 0) {
                dx = 0;
                dy = -1;
                if (!gameStarted) startGame();
            } else if (key === 'ArrowDown' && dy === 0) {
                dx = 0;
                dy = 1;
                if (!gameStarted) startGame();
            } else if (key === 'ArrowLeft' && dx === 0) {
                dx = -1;
                dy = 0;
                if (!gameStarted) startGame();
            } else if (key === 'ArrowRight' && dx === 0) {
                dx = 1;
                dy = 0;
                if (!gameStarted) startGame();
            }
        });

        // Button controls
        document.querySelectorAll('.key').forEach(key => {
            key.addEventListener('click', () => {
                const direction = key.dataset.key;
                
                if (direction === 'up' && dy === 0) {
                    dx = 0;
                    dy = -1;
                } else if (direction === 'down' && dy === 0) {
                    dx = 0;
                    dy = 1;
                } else if (direction === 'left' && dx === 0) {
                    dx = -1;
                    dy = 0;
                } else if (direction === 'right' && dx === 0) {
                    dx = 1;
                    dy = 0;
                }
                
                if (!gameStarted) startGame();
            });
        });

        startBtn.addEventListener('click', startGame);
        restartBtn.addEventListener('click', restart);

        // Initialize
        init();
    </script>
</body>
</html>
